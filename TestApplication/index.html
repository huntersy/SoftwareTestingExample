<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QA Demo Store</title>
<style>body{font-family:Arial,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#202124}header{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:1rem}h1{margin-right:auto}.controls{display:flex;gap:.5rem;align-items:center}input,button{font:inherit;padding:.6rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:1.5rem}.card{display:block;border:1px solid #ddd;border-radius:8px;padding:1rem;color:inherit;text-decoration:none}.card:hover{border-color:#555}.badge{display:inline-block;background:#e7f5e9;padding:.2rem .5rem;border-radius:4px;margin-top:.5rem}#search-result-count{margin-top:1rem}#no-products{margin-top:1rem}</style></head>
<body data-page="home"><header><h1>QA Demo Store</h1><div class="controls"><input data-test="search-query" type="search" placeholder="Search products" aria-label="Search products"><button data-test="nav-categories" type="button" aria-expanded="false">Categories</button></div></header>
<div id="categories" hidden>Tools · Hardware · Safety</div><p><label><input data-test="eco-friendly-filter" type="checkbox"> Eco-friendly products only</label></p>
<p data-test="search-result-count" id="search-result-count" aria-live="polite"></p><p id="no-products" hidden>There are no products found.</p><main data-test="product-list" class="grid"></main><script src="app.js"></script></body></html>
