name: Playwright NUnit CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and Run Playwright Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          .\bin\Release\net8.0\playwright.ps1 install chromium

      - name: Run NUnit tests
        run: dotnet test --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
