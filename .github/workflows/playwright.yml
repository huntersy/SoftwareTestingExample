name: Playwright NUnit CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and Run Playwright Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright Chromium
        shell: pwsh
        run: .\bin\Release\net8.0\playwright.ps1 install chromium

      - name: Start controlled demo application
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "python" -ArgumentList @("-m", "http.server", "4173", "--directory", "TestApplication") -PassThru -WindowStyle Hidden
          "DEMO_SERVER_PID=$($server.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173/" -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "The controlled demo application did not become ready." }

      - name: Run NUnit tests
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: dotnet test --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Stop controlled demo application
        if: always()
        shell: pwsh
        run: |
          if ($env:DEMO_SERVER_PID) {
            Stop-Process -Id ([int]$env:DEMO_SERVER_PID) -Force -ErrorAction SilentlyContinue
          }
